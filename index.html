                        else if (linesLeft === needed && count >= max) opts = [0]; 
                        else if (linesLeft === needed) opts = (count <= max - 2) ? [1, 2, 3] : [1, 2];
                    }
                    if (count >= max) opts = [0];
                    let choice = opts[Math.floor(Math.random() * opts.length)];
                    
                    if (choice === 1) { line = `${getNextEmoji()} ${line}`; count++; }
                    else if (choice === 2) { line = `${line} ${getNextEmoji()}`; count++; }
                    else if (choice === 3) { line = `${getNextEmoji()} ${line} ${getNextEmoji()}`; count += 2; }
                    result.push(line);
                }
                return result;
            }

            const rLower = rawText.toLowerCase();
            const isPickup = rLower.includes('pickup') || rLower.includes('pick up') || rLower.includes('walgreens') || rLower.includes('w@lgreens');
            const dynamicStatuses = isPickup ? ["Pickup!", "In-store!", "Grab at store!", "Local pickup!"] : ["Shipped!", "To your door!", "Delivery included!", "On its way!"];

            let phase0 = `${rawText}`;
            if (customLine) phase0 += `\n[Custom Injection: ${customLine}]`;
            document.getElementById('out-phase0').innerText = phase0;
            currentRawOutput = `=== PHASE 0: TARGET LOCK ===\n${phase0}\n\n`;

            let sl = [];
            for(let i=0; i<3; i++) {
                let priceDisplay = aiData.sale_price === "???" ? "???" : cleanText(aiData.sale_price);
                let hook = `${selectedPrefixes[i]} ${priceDisplay.includes("???") ? priceDisplay : "$" + priceDisplay.replace('$', '')} ${dynamicStatuses[i]}`;
                if(aiData.reg_price !== "NONE") hook += ` (${selectedCompLabels[i]} ${cleanText(aiData.reg_price)})`;
                let flip = Math.random() > 0.5;
                sl.push(flip ? `${hook} -- ${cleanTitle}` : `${cleanTitle} -- ${hook}`);
            }

            let postOutputs = [];
            let commentOutputs = [];

            if (dealType === 'regular') {
                // REGULAR DEAL ASSEMBLY
                for(let i=0; i<3; i++) {
                    let b2 = aiData.b2_strategies[i] !== "DEAD" ? `${cleanText(aiData.b2_strategies[i])}` : "";
                    let b5 = aiData.b5_perks && aiData.b5_perks[i] !== "DEAD" ? `${cleanText(aiData.b5_perks[i])} ` : "";
                    let b6 = aiData.b6_savings && aiData.b6_savings[i] !== "DEAD" ? `${cleanText(aiData.b6_savings[i])} ` : "";
                    let b7 = aiData.b7_occasions && aiData.b7_occasions[i] !== "DEAD" ? `${cleanText(aiData.b7_occasions[i])} ` : "";
                    let b8 = aiData.b8_overflow && aiData.b8_overflow[i] !== "DEAD" ? `${cleanText(aiData.b8_overflow[i])} ` : "";
                    let b9 = aiData.b9_overflow && aiData.b9_overflow[i] !== "DEAD" ? `${cleanText(aiData.b9_overflow[i])} ` : "";
                    
                    let bottomLine = `${b5}${b6}${b7}${b8}${b9}`.trim();
                    let inf = cleanText(aiData.inferences[i]);
                    
                    let flipB1 = Math.random() > 0.5;
                    let discLine = flipB1 
                        ? `${selectedDiscoveries[i]} on ${retailer}!` 
                        : `On ${retailer}, ${selectedDiscoveries[i].toLowerCase()}!`;
                    
                    let ptrLine = selectedPointers[i];
                    let rawLines = [];
                    const shuffleType = (i + dealNum) % 3; 
                    
                    if(shuffleType === 0) { 
                        rawLines.push(discLine, sl[i]);
                        if(b2) rawLines.push(`${b2} ${ptrLine}`); else rawLines.push(ptrLine);
                        rawLines.push(inf);
                        if(bottomLine) rawLines.push(bottomLine);
                    } else if (shuffleType === 1) { 
                        rawLines.push(inf, sl[i], discLine);
                        if(b2) rawLines.push(`${ptrLine} ${b2}`); else rawLines.push(ptrLine);
                        if(bottomLine) rawLines.push(bottomLine);
                    } else { 
                        rawLines.push(sl[i], discLine);
                        if(bottomLine) rawLines.push(`${inf} ${bottomLine}`); else rawLines.push(inf);
                        if(b2) rawLines.push(b2);
                        rawLines.push(ptrLine);
                    }

                    let customText = aiData.custom_line_rephrases && aiData.custom_line_rephrases[i] !== "DEAD" ? cleanText(aiData.custom_line_rephrases[i]) : "";
                    if (customText) {
                        const randIdx = Math.floor(Math.random() * (rawLines.length + 1));
                        rawLines.splice(randIdx, 0, customText);
                    }

                    let emojifiedLines = injectEmojisV8(rawLines, 3, 6);

                    let touchIndex = i; 
                    if (touchIndex >= emojifiedLines.length - 1) touchIndex = emojifiedLines.length - 2;
                    
                    let postText = emojifiedLines[0];
                    for(let j = 1; j < emojifiedLines.length; j++) {
                        if (j - 1 === touchIndex) postText += `\n${emojifiedLines[j]}`; 
                        else postText += `\n\n${emojifiedLines[j]}`; 
                    }
                    postOutputs.push(postText);
                    document.getElementById(`out-post${i+1}`).innerText = postText;
                    currentRawOutput += `=== POST VARIATION ${i+1} ===\n${postText}\n\n`;
                }

                for(let i=0; i<3; i++) {
                    let praise = cleanText(aiData.praises[i]);
                    let disc = cleanText(aiData.disclaimers[i]);
                    let linkLine = `${selectedLinkLeads[i]} ${extractedURL}`;

                    let rawLines = [];
                    const commentType = (i + dealNum) % 3;

                    if(commentType === 0) { 
                        rawLines.push(`${praise} ${linkLine} ${disc}`);
                    } else if (commentType === 1) { 
                        rawLines.push(praise, linkLine, disc);
                    } else { 
                        rawLines.push(linkLine, `${disc} ${praise}`);
                    }
                    
                    let emojifiedLines = injectEmojisV8(rawLines, 1, 3);
                    
                    let cText = "";
                    if(commentType === 0) cText = emojifiedLines[0];
                    else if (commentType === 1) cText = emojifiedLines.join("\n\n");
                    else cText = emojifiedLines.join("\n\n");

                    commentOutputs.push(cText);
                    document.getElementById(`out-com${i+1}`).innerText = cText;
                    currentRawOutput += `=== COMMENT ${i+1} ===\n${cText}\n\n`;
                }

            } else {
                // RUN DEAL ASSEMBLY
                for(let i=0; i<3; i++) {
                    let hook = cleanText(aiData.curiosity_hooks[i]);
                    let inf = cleanText(aiData.inferences[i]);
                    let keyword = cleanText(aiData.scrubbed_keyword);
                    let ptrLine = selectedShortPointers[i];
                    
                    let rawLines = [`${hook} ${inf} with this ${keyword}! ${ptrLine}`];
                    
                    let emojifiedLines = injectEmojisV8(rawLines, 1, 3);
                    let postText = emojifiedLines[0];
                    
                    postOutputs.push(postText);
                    document.getElementById(`out-post${i+1}`).innerText = postText;
                    currentRawOutput += `=== POST VARIATION ${i+1} ===\n${postText}\n\n`;
                }

                for(let i=0; i<3; i++) {
                    let praise = cleanText(aiData.praises[i]);
                    let disc = cleanText(aiData.disclaimers[i]);
                    let linkLine = `${selectedLinkLeads[i]} ${extractedURL}`;
                    
                    let flipB1 = Math.random() > 0.5;
                    let discLine = flipB1 
                        ? `${selectedDiscoveries[i]} on ${retailer}!` 
                        : `On ${retailer}, ${selectedDiscoveries[i].toLowerCase()}!`;

                    let b2 = aiData.b2_strategies[i] !== "DEAD" ? `${cleanText(aiData.b2_strategies[i])}` : "";
                    let b5 = aiData.b5_perks && aiData.b5_perks[i] !== "DEAD" ? `${cleanText(aiData.b5_perks[i])} ` : "";
                    let b6 = aiData.b6_savings && aiData.b6_savings[i] !== "DEAD" ? `${cleanText(aiData.b6_savings[i])} ` : "";
                    let b7 = aiData.b7_occasions && aiData.b7_occasions[i] !== "DEAD" ? `${cleanText(aiData.b7_occasions[i])} ` : "";
                    let b8 = aiData.b8_overflow && aiData.b8_overflow[i] !== "DEAD" ? `${cleanText(aiData.b8_overflow[i])} ` : "";
                    let b9 = aiData.b9_overflow && aiData.b9_overflow[i] !== "DEAD" ? `${cleanText(aiData.b9_overflow[i])} ` : "";
                    
                    let bottomLine = `${b2} ${b5}${b6}${b7}${b8}${b9}`.trim();

                    let rawLines = [praise, linkLine, disc, discLine, sl[i]];
                    if (bottomLine) rawLines.push(bottomLine);

                    let customText = aiData.custom_line_rephrases && aiData.custom_line_rephrases[i] !== "DEAD" ? cleanText(aiData.custom_line_rephrases[i]) : "";
                    if (customText) {
                        const randIdx = Math.floor(Math.random() * (rawLines.length + 1));
                        rawLines.splice(randIdx, 0, customText);
                    }

                    let emojifiedLines = injectEmojisV8(rawLines, 3, 6);
                    let cText = emojifiedLines.join("\n\n");

                    commentOutputs.push(cText);
                    document.getElementById(`out-com${i+1}`).innerText = cText;
                    currentRawOutput += `=== COMMENT ${i+1} ===\n${cText}\n\n`;
                }
            }

            // DAILY THREAD ASSEMBLY (Universal)
            let priceDisplayDT = aiData.sale_price === "???" ? "???" : cleanText(aiData.sale_price);
            let dtHook = `${selectedPrefixes[3]} ${priceDisplayDT.includes("???") ? priceDisplayDT : "$" + priceDisplayDT.replace('$', '')} ${dynamicStatuses[3]}`;
            
            let dtHeader = isOdd ? `${dtHook} on ${retailer} -- ${cleanTitle}` : `${cleanTitle} -- ${dtHook} on ${retailer}`;
            if(aiData.reg_price !== "NONE") dtHeader += ` (${selectedCompLabels[3]} ${cleanText(aiData.reg_price)})`;
            
            let dtB2 = aiData.b2_strategies[3] !== "DEAD" ? cleanText(aiData.b2_strategies[3]) : "";
            let dtB5 = aiData.b5_perks && aiData.b5_perks[3] !== "DEAD" ? `${cleanText(aiData.b5_perks[3])} ` : "";
            let dtB6 = aiData.b6_savings && aiData.b6_savings[3] !== "DEAD" ? `${cleanText(aiData.b6_savings[3])} ` : "";
            let dtB7 = aiData.b7_occasions && aiData.b7_occasions[3] !== "DEAD" ? `${cleanText(aiData.b7_occasions[3])} ` : "";
            let dtB8 = aiData.b8_overflow && aiData.b8_overflow[3] !== "DEAD" ? `${cleanText(aiData.b8_overflow[3])} ` : "";
            let dtB9 = aiData.b9_overflow && aiData.b9_overflow[3] !== "DEAD" ? `${cleanText(aiData.b9_overflow[3])} ` : "";
            
            let dtOverflow = `${dtB5}${dtB6}${dtB7}${dtB8}${dtB9}`.trim();

            let rawDtLines = [];
            if(isOdd) {
                rawDtLines.push(dtHeader, `Check it out right here: ${extractedURL}`, dtSignoff);
                if(dtB2) rawDtLines.push(dtB2);
                if(dtOverflow) rawDtLines.push(dtOverflow);
            } else {
                rawDtLines.push(dtSignoff, dtHeader, `Check it out right here: ${extractedURL}`);
                if(dtB2) rawDtLines.push(dtB2);
                if(dtOverflow) rawDtLines.push(dtOverflow);
            }

            let customTextDT = aiData.custom_line_rephrases && aiData.custom_line_rephrases[3] !== "DEAD" ? cleanText(aiData.custom_line_rephrases[3]) : "";
            if (customTextDT) {
                const randIdxDT = Math.floor(Math.random() * (rawDtLines.length + 1));
                rawDtLines.splice(randIdxDT, 0, customTextDT);
            }

            let emojifiedDtLines = injectEmojisV8(rawDtLines, 3, 5);
            let dtText = emojifiedDtLines.join("\n\n");

            document.getElementById('out-dt').innerText = dtText;
            currentRawOutput += `=== DAILY THREAD COMMENT ===\n${dtText}`;

            dealCount++;
            const timestamp = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', second:'2-digit'});
            
            const dealData = {
                phase0: phase0,
                posts: postOutputs,
                comments: commentOutputs,
                dt: dtText,
                raw: currentRawOutput
            };
            sessionHistory.push(dealData);
            const index = sessionHistory.length - 1;

            const historyLog = document.getElementById('historyLog');
            const emptyMsg = document.getElementById('emptyHistory');
            if(emptyMsg) emptyMsg.remove();

            const historyCard = `
                <div class="history-card" onclick="loadHistory(${index})">
                    <span class="history-time">${day} • ${timestamp}</span>
                    <div class="history-title">Deal ${dealNum}: ${cleanTitle}</div>
                </div>
            `;
            
            historyLog.innerHTML = historyCard + historyLog.innerHTML;
            document.getElementById('sessionBaseHeader').innerText = `📚 SESSION BASE (${dealCount} / 14)`;

            if(dealNum < 7) dealNumInput.value = dealNum + 1;
            else dealNumInput.value = 1;
            updateButtonText();

            document.getElementById('rawText').value = "";
            document.getElementById('customLine').value = "";

        } catch (error) {
            alert("Error: " + error.message);
        } finally {
            updateButtonText();
            btn.disabled = false;
        }
    }
</script>
